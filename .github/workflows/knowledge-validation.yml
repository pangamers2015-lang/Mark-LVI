name: Yon knowledge validation
on:
  push:
    branches: [feature/behavioral-preferences]
    paths: ["knowledge/updates/**","memory/knowledge_updates.py","memory/cognitive_runtime.py","actions/knowledge_update.py","core/prompt.txt","tests/test_knowledge_updates.py",".github/workflows/knowledge-validation.yml"]
  pull_request:
    paths: ["knowledge/updates/**","memory/knowledge_updates.py","tests/test_knowledge_updates.py",".github/workflows/knowledge-validation.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/test_knowledge_updates.py tests/test_cognitive_runtime.py -q
